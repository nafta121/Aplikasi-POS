<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#f59e0b" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background with rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Subtle grid pattern lines for hardware store aesthetic -->
  <path d="M64 256h384M256 64v384" stroke="#334155" stroke-width="2" stroke-dasharray="8 8" opacity="0.4" />

  <!-- Central Hard Hat Icon in safe zone (80% circle) -->
  <g transform="translate(106, 116)" filter="url(#glow)">
    <!-- Hard Hat Crown Base -->
    <path
      d="M30 190 C30 90, 80 40, 150 40 C220 40, 270 90, 270 190 Z"
      fill="url(#amberGrad)"
    />
    <!-- Hat Brim -->
    <path
      d="M10 190 C10 178, 20 170, 35 170 L265 170 C280 170, 290 178, 290 190 C290 205, 275 215, 255 215 L45 215 C25 215, 10 205, 10 190 Z"
      fill="#d97706"
    />
    <!-- Ridge Center -->
    <path
      d="M135 38 L165 38 L165 170 L135 170 Z"
      fill="#fef3c7"
      opacity="0.5"
    />
    <!-- Ridge Shadow -->
    <path
      d="M110 52 C110 52, 122 45, 135 45 L135 170 L115 170 Z"
      fill="#b45309"
      opacity="0.4"
    />
    <!-- POS / Barcode / Material badge inside hat -->
    <g transform="translate(100, 105)">
      <rect x="0" y="0" width="100" height="42" rx="8" fill="#0f172a" />
      <text x="50" y="27" fill="#fbbf24" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="20" text-anchor="middle" letter-spacing="2">POS</text>
    </g>
  </g>

  <!-- Outer Ring Accent -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#f59e0b" stroke-width="4" stroke-opacity="0.25" />
</svg>
